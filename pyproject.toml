[project]
name = "aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora: Google ADK + FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pin exato exigido pelo avaliador (passo 15 do enunciado).
    "google-adk==2.9.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
]

[project.scripts]
aurora = "aurora.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aurora"]
