[project]
name = "aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora: Google ADK + FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pin exato exigido pelo avaliador (passo 15 do enunciado).
    "google-adk==2.9.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    # DatabaseSessionService (ADK) exige sqlalchemy async; o extra [db] do ADK
    # arrastaria sqlalchemy-spanner — declaramos só o necessário.
    "sqlalchemy[asyncio]>=2,<3",
]

[project.scripts]
aurora = "aurora.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aurora"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
